<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d71920">
  <title>DIA CONFERÊNCIA - LOJA 226</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
    }

    header {
      background: #d71920;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 12px;
    }

    .card {
      background: white;
      padding: 18px;
      margin-top: 18px;
      border-radius: 12px;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      background: #d71920;
      color: white;
      border: none;
      font-weight: bold;
    }

    .produto {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }

    .secundario {
      background: #333;
    }
  </style>
</head>

<body>

<header>
  <h1>DIA CONFERÊNCIA</h1>
  <h2>LOJA 226</h2>
  <p>Conferência de recebimento</p>
</header>

<div class="card">
  <h3>Dados do recebimento</h3>

  <input id="nota" placeholder="Número da nota fiscal">
  <input id="fornecedor" placeholder="Nome do fornecedor">
  <input id="data" type="date">
</div>

<div class="card">
  <h3>Cadastrar produto</h3>

  <input id="codigo" placeholder="Código de barras">
  <input id="descricao" placeholder="Descrição do produto">
  <input id="quantidade" type="number" min="0" placeholder="Quantidade recebida">
  <input id="divergencia" placeholder="Divergência (se houver)">

  <button onclick="adicionar()">ADICIONAR PRODUTO</button>
</div>

<div class="card">
  <h3>Produtos conferidos</h3>
  <div id="lista"></div>
  <h3 id="total">Total de produtos: 0</h3>

  <button class="secundario" onclick="exportar()">EXPORTAR RELATÓRIO</button>
</div>

<script>
  let produtos = JSON.parse(localStorage.getItem("produtos226") || "[]");

  function salvar() {
    localStorage.setItem("produtos226", JSON.stringify(produtos));
  }

  function adicionar() {
    const codigo = document.getElementById("codigo").value.trim();
    const descricao = document.getElementById("descricao").value.trim();
    const quantidade = document.getElementById("quantidade").value;
    const divergencia = document.getElementById("divergencia").value.trim();

    if (!codigo || !descricao || quantidade === "" || Number(quantidade) < 0) {
      alert("Preencha o código, a descrição e uma quantidade válida.");
      return;
    }

    produtos.push({
      nota: document.getElementById("nota").value,
      fornecedor: document.getElementById("fornecedor").value,
      data: document.getElementById("data").value,
      codigo,
      descricao,
      quantidade,
      divergencia
    });

    salvar();
    mostrar();

    document.getElementById("codigo").value = "";
    document.getElementById("descricao").value = "";
    document.getElementById("quantidade").value = "";
    document.getElementById("divergencia").value = "";
  }

  function mostrar() {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    produtos.forEach((p, i) => {
      const item = document.createElement("div");
      item.className = "produto";

      const titulo = document.createElement("strong");
      titulo.textContent = p.descricao;

      const detalhes = document.createElement("p");
      detalhes.textContent = "Código: " + p.codigo +
        " | Quantidade: " + p.quantidade +
        " | Divergência: " + (p.divergencia || "Nenhuma");

      const excluir = document.createElement("button");
      excluir.className = "secundario";
      excluir.textContent = "Excluir";
      excluir.onclick = () => {
        produtos.splice(i, 1);
        salvar();
        mostrar();
      };

      item.append(titulo, detalhes, excluir);
      lista.appendChild(item);
    });

    document.getElementById("total").textContent =
      "Total de produtos: " + produtos.length;
  }

  function exportar() {
    if (!produtos.length) {
      alert("Não existem produtos cadastrados.");
      return;
    }

    const linhas = [
      ["Nota fiscal", "Fornecedor", "Data", "Código", "Descrição", "Quantidade", "Divergência"],
      ...produtos.map(p => [
        p.nota, p.fornecedor, p.data, p.codigo,
        p.descricao, p.quantidade, p.divergencia
      ])
    ];

    const csv = "\uFEFF" + linhas.map(linha =>
      linha.map(v => '"' + String(v ?? "").replace(/"/g, '""') + '"').join(";")
    ).join("\n");

    const arquivo = new Blob([csv], {type: "text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(arquivo);
    const link = document.createElement("a");
    link.href = url;
    link.download = "conferencia_loja226.csv";
    link.click();
    URL.revokeObjectURL(url);
  }

  mostrar();
</script>

</body>
</html>
